name: Import portfolio source
on:
  push:
    paths:
      - ".github/workflows/publish-portfolio.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import public portfolio assets
        run: |
          set -e
          git clone https://github.com/Mayya8888/plagin_url.git /tmp/portfolio-source
          git -C /tmp/portfolio-source checkout 9d97d959a648d4d1ff87e272e03bff82348c671e
          rsync -a --exclude=.git /tmp/portfolio-source/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import portfolio original assets" || true
          git push origin HEAD:main
